# Production-like stack:  docker compose -f ops/docker-compose.yml up -d
# The DB port is NOT published here (architecture §12). Dev adds it via docker-compose.dev.yml.
name: restaurant-erp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      TZ: Asia/Karachi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.api
    restart: unless-stopped
    environment: &apienv
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp}
    depends_on:
      db: { condition: service_healthy }
    # Forward-only migrations run at container start (architecture §13).
    command: sh -c "pnpm --filter @erp/api db:migrate && pnpm --filter @erp/api start"
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: ops/Dockerfile.api
    restart: unless-stopped
    environment: *apienv
    depends_on:
      api: { condition: service_healthy }
    command: pnpm --filter @erp/api worker

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/web/dist:/srv/web:ro # build first: pnpm --filter @erp/web build
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
